<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="chhrGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E0E0E" />
      <stop offset="100%" stop-color="#1E1E28" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD700" />
      <stop offset="100%" stop-color="#FF1F02" />
    </linearGradient>
  </defs>

  <!-- Circular Base Badge -->
  <circle cx="50" cy="50" r="48" fill="url(#chhrGrad)" stroke="#FF1F02" stroke-width="2.5" />
  
  <!-- Inner Ring -->
  <circle cx="50" cy="50" r="42" fill="none" stroke="url(#goldGrad)" stroke-width="1.2" stroke-dasharray="3,3" opacity="0.8" />

  <!-- Mountain Sanctuary Emblem -->
  <path d="M50 22 L72 65 L28 65 Z" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linejoin="round" />
  <path d="M50 36 L64 65 L36 65 Z" fill="#FF1F02" opacity="0.85" />
  <path d="M50 22 L50 65" stroke="#FFFFFF" stroke-width="1.5" opacity="0.6" />

  <!-- Sun / Star Crest -->
  <circle cx="50" cy="20" r="3.5" fill="#FFD700" />
  
  <!-- Monogram text -->
  <text x="50" y="82" font-family="'Cinzel', 'Playfair Display', serif" font-size="11" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">CHHR</text>
</svg>
